[project]
name = "ray-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KrisBold12", email = "kristianboldini@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "pyarrow>=15.0.0",
    "ray[data]>=2.58.0",
    "tqdm>=4.70.0",
    "typing-extensions>=4.8.0",
]

[project.scripts]
ray-data = "ray_data:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
